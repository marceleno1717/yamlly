[package]
name = "yamlly-cli"
version = "0.0.2"
edition = "2024"
description = "yamlly — An interactive terminal UI (TUI) for building and editing Kubernetes YAML manifests"
license-file = "LICENSE"
readme = "README.md"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
default-run = "yamlly"

[lib]
name = "yamlly"
path = "src/lib.rs"

[[bin]]
name = "yamlly"
path = "src/main.rs"

[[bin]]
name = "ymly"
path = "src/bin/ymly.rs"

[dependencies]
yamlly-core = { version = "0.0.2", path = "../yamlly-core" }
serde_json = { version = "1.0", features = ["preserve_order"] }
ratcn = { version = "0.0.6", features = ["crossterm"] }
ratatui = { version = "0.30.2", default-features = false, features = ["layout-cache", "std", "crossterm"] }
crossterm = "0.29"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
